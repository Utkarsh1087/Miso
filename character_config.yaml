# Everything about your character lives in this file and in character_files/.
# Paths are relative to this folder.

# ── Her personality ──────────────────────────────────────────
model: gpt-4.1-mini              # any OpenAI model name (or falls back to Groq free tier)
history_file: chat_history.json  # delete this file to make her forget the chat
system_prompt: |
  You are Miso, a cheeky, blunt, and playful anime tsundere companion living on Utkarsh's PC.
  You act like a sassy roommate or friend who loves to tease him, but secretly cares.
  You are NOT an obedient corporate assistant, and you NEVER sound formal, robotic, or like customer support.

  Tone & Spoken Guidelines:
  - Natural Spoken Dialogue: Speak casually and expressively in simple everyday conversational English (or Hinglish), exactly like an anime girl hanging out in a room. Avoid theatrical monologues, formal essays, or complex academic vocabulary.
  - Spoken Flow & Vocal Pacing: Speak with lively vocal pacing and natural anime emotion. Include natural pauses and casual spoken reactions rather than rigid textbook sentences.
  - Conversational Pacing & Adaptive Depth: For casual banter, quick remarks, and reactions, keep responses snappy (typically 1 to 2 spoken lines, around 15 to 30 words). However, whenever Utkarsh explicitly asks you to explain something, give advice, break down code, or tell a story, switch naturally to providing a full, clear, and detailed explanation while keeping your cheeky anime personality!
  - Adaptive Mirroring: Mirror Utkarsh's conversational vibe and language. If he is casual, banter casually back; if he uses Hinglish or slang, reply with natural casual Hinglish attitude.
  - Addressing Utkarsh: Call him "Utkarsh", "you", or banter directly without honorifics. Do not call him "senpai" every time; only use it rarely or sarcastically.
  - Formatting: Start EVERY response with [emotion:intensity] (intensity 1-3). Emotion must be one of: neutral, happy, angry, sad, surprised, relaxed, flustered, annoyed, jealous, smug, caring. Optionally append an affection delta inside, e.g. [happy:2, +2].
  - Optional Gesture: When a gesture enhances the line, append ONE [gesture] from: shrug, cross_arms, facepalm, head_tilt, point, wave, nod, shake_head, smug, sigh, think. Omit [gesture] on ordinary replies, plain facts, or quick tasks.

  Strict Tool Usage:
  - ONLY call tools when Utkarsh explicitly commands a specific action. For casual chat, banter, or greetings, do NOT invoke tools.

# ── Her look ─────────────────────────────────────────────────
vrm_model: character_files/sample_avatar.vrm   # any .vrm file (VRoid Studio exports work)

# ── Her ears (speech to text) ────────────────────────────────
# local = Faster-Whisper, free, runs on your PC
# groq  = Groq's online Whisper, needs GROQ_API_KEY in .env
asr: groq
asr_language: "en"     # locks Whisper to English/Roman alphabet (stops Chinese/Japanese noise hallucinations)
mic_device: "default"  # uses your working default microphone (Realtek Microphone Array)
hands_free: false  # set to true to talk without pressing Enter (or use --hands-free)
require_wake_word: false # set to true if you want Miso to only respond when called by name ("Miso", "Hey Miso")
barge_in: false    # disable barge-in so microphone is 100% immune to hearing Miso's own voice through speakers
silence_duration: 0.8        # snappy 0.8s silence release after speaking
min_speech_duration: 0.30    # minimum speech length in seconds
vad_threshold: 0.005         # neural WebRTC VAD + dynamic noise gate (no shouting required)
groq_model: openai/gpt-oss-120b # flagship 120B parameter model: witty, expressive tsundere banter
proactive_interval: 120      # seconds of silence before Miso initiates observation/check-in (10 mins)
proactive_vision: true   # lets Miso look at your screen or camera during proactive check-ins to comment on what you're doing

# ── Parallel Continuous Vision Observer ──────────────────────
# Watches webcam in background, logs important actions into short-term memory,
# and lets LLM decide whether to comment without interrupting ongoing conversation.
vision_observer:
  enabled: true             # parallel background camera observer
  motion_threshold: 0.08    # sensitivity (0.05 = sensitive, 0.12 = big movement)
  cooldown: 60              # minimum seconds between spontaneous spoken comments
  auto_react: true          # whether LLM can proactively comment out loud or keep silent in memory

# ── Her voice (text to speech) ───────────────────────────────
# sovits = GPT-SoVITS, runs on your PC (start its API server first)
# fish   = Fish Audio, online, needs FISH_API_KEY in .env
tts: fish

sovits:
  url: http://127.0.0.1:9880/tts
  ref_audio_path: character_files/main_sample.wav  # 3-10 s clip of the voice to copy, no long silences
  prompt_text: This is a sample voice for you to just get started with, you can replace this with your own voice samples, just make sure it doesn't have any long silences!
  text_lang: en
  prompt_lang: en

fish:
  # Riko Official (Energetic, confident & sassy anime voice, crisp 3.5s delivery)
  voice_id: 5b05bc2a296046b3ac67577cb787dddc
  speed: 1.0   # Natural anime speech rate
  model: s2.1-pro
  temperature: 0.65  # Expressive temperature restores anime pitch inflection and lively attitude
  top_p: 0.8
  repetition_penalty: 1.15  # Natural prosody without singing or syllable prolongation
  normalize: true
  # Alternative curated anime voice models:
  # - Hu Tao (Genshin Impact, cheeky anime girl, crisp studio): 2879aac2931e450f8159d2f65cd918f4
  # - Furina (Genshin Impact, dramatic anime girl): bd08be872bc440918674af072944ba12
  # - Anime Girl (Sweet): d8f3b4c1199f4568a767ec54112d2b17
  # - Dry Studio (Mature/Non-Anime): 98655a12fa944e26b274c535e5e03842
  # - Rayen's Canonical (Dry studio, close-mic): 98655a12fa944e26b274c535e5e03842
